<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>W-Reader · 静心阅读</title>
  <link rel="stylesheet" href="reader.css">
  <script src="epub.js" defer></script>
  <script src="reader.js" defer></script>
</head>
<body>
  <div class="reader-shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="W-Reader 首页"><span class="mark" aria-hidden="true">W</span><span>W-Reader</span></a>
      <span class="top-note">给文字，一点安静的空间</span>
      <span id="library" hidden><label for="library-books">书架</label> <select id="library-books" aria-label="已保存的书籍"></select> <button id="library-open" type="button">打开</button> <button id="library-delete" type="button">删除</button></span>
      <button id="open-file" class="open-button" type="button" aria-label="打开本地书籍">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4"/></svg>
        <span>打开书籍</span>
      </button>
    </header>

    <main>
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <div class="welcome-copy">
          <p class="eyebrow"><span class="eyebrow-line"></span> YOUR READING SPACE</p>
          <h1 id="welcome-title">让阅读，<br><em>慢下来。</em></h1>
          <p class="welcome-description">打开一本本地书籍，在留白与文字之间，<br class="desktop-break">找回属于自己的阅读节奏。</p>
          <button class="welcome-cta" id="welcome-open" type="button">选择一本书 <span aria-hidden="true">↗</span></button>
          <p class="format-note">支持 UTF-8 TXT 和 EPUB 文字 · 文件仅在当前页面中读取</p>
        </div>
        <div class="book-art" aria-hidden="true">
          <div class="sun"></div><div class="book-shadow"></div>
          <div class="book"><div class="book-spine"></div><div class="book-inner"><span class="book-label">W — READER</span><span class="book-title">在文字<br>之间</span><span class="book-rule"></span><span class="book-subtitle">A QUIET PLACE TO READ</span></div></div>
          <span class="orbit orbit-one"></span><span class="orbit orbit-two"></span>
          <span class="art-caption">VOL. 01 <i>·</i> YOUR OWN PACE</span>
        </div>
      </section>

      <section class="reading-view" id="reading-view" hidden aria-label="阅读器">
        <div class="book-meta"><div class="meta-icon" aria-hidden="true">文</div><div class="meta-copy"><p class="eyebrow">NOW READING</p><h2 id="file-name">未命名.txt</h2></div><span class="file-kind" id="file-kind">TXT</span></div>
        <details class="toc" id="toc-panel"><summary><span>目录</span><span id="toc-count" class="toc-count"></span></summary><p id="toc-empty" class="toc-empty" hidden></p><nav id="toc-list" aria-label="书籍目录"></nav></details>
        <div class="reading-rule"></div>
        <article id="page-text" class="page-text" tabindex="0" aria-label="当前页文本" aria-live="polite"></article>
        <div class="reader-footer">
          <button id="prev-page" class="page-button" type="button" aria-label="上一页"><span aria-hidden="true">←</span><span>上一页</span></button>
          <div class="page-status" aria-live="polite"><span id="page-current">1</span><span class="page-slash">/</span><span id="page-total">1</span><span class="page-label">页</span></div>
          <button id="next-page" class="page-button next" type="button" aria-label="下一页"><span>下一页</span><span aria-hidden="true">→</span></button>
        </div>
      </section>
    </main>

    <footer class="bottom-bar">
      <span class="footer-note"><span class="status-dot" aria-hidden="true"></span><span id="footer-status">准备好开始阅读</span></span>
      <div class="type-controls" role="group" aria-label="字体大小">
        <span class="type-label">字号</span>
        <button id="font-smaller" class="type-button" type="button" aria-label="减小字号" title="减小字号">A<sup>−</sup></button>
        <span id="font-size" class="font-size" aria-live="polite">18</span>
        <button id="font-larger" class="type-button" type="button" aria-label="增大字号" title="增大字号">A<sup>+</sup></button>
      </div>
    </footer>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
